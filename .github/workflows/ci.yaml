name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize, edited]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  semantic-pull-request:
    uses: VeryGoodOpenSource/very_good_workflows/.github/workflows/semantic_pull_request.yml@v1
    with:
      # Keep in sync with the scopes listed in CLAUDE.md.
      scopes: |
        source
        directive
        inline
        chord
        ast
        diagnostic
        assembler
        api
        spec
        docs
        ci
        deps
        release
        claude

  build:
    uses: VeryGoodOpenSource/very_good_workflows/.github/workflows/dart_package.yml@v2
    with:
      analyze_directories: lib test example
      min_coverage: 85
      run_bloc_lint: false

  license-check:
    uses: VeryGoodOpenSource/very_good_workflows/.github/workflows/license_check.yml@v1

  cognitive-complexity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: stable
      # Targets the whole repo: without one the scanner only covers lib/,
      # and test/ and example/ would go unchecked.
      - name: Gate cognitive complexity
        run: dart run cognitive_complexity@2.0.0 --fail-threshold 15 .

  publish-dry-run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: stable
      - run: dart pub get
      - run: dart pub publish --dry-run

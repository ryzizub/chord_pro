include: package:very_good_analysis/analysis_options.yaml

linter:
  rules:
    # Every public type in this package is a value type: all fields are
    # final and the AST is copy-on-transform, so `==`/`hashCode` are
    # correct on them. The rule only accepts `@immutable` as proof, which
    # would mean depending on `package:meta`, and the package's zero
    # runtime dependencies are deliberate.
    avoid_equals_and_hash_code_on_mutable_classes: false
